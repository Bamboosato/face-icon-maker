name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Clean install
        run: npm ci --include=dev
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Asset checker tests
        run: npm run test:assets
      - name: Production build
        run: npm run build
      - name: Distributed models and runtimes
        run: npm run check:assets

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Clean install
        run: npm ci --include=dev
      - name: Security policy tests
        run: npm run test:security
      - name: Audit production and all dependencies
        run: npm run audit:security
      - name: Retain audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .security-audit/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
